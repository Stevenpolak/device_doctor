name: Bug report
description: Something in Device Doctor doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The diagnostics file below helps the most: it shows what Device Doctor saw.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Device Doctor version
      description: "Settings → Devices & services → Device Doctor, under the name."
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: "Settings → About."
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings → Devices & services → Device Doctor → ⋮ → **Download diagnostics**, then drag the file in here.
        It lists the names of your integrations and devices that Device Doctor checked; remove any you'd rather not share.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Anything from Settings → System → Logs that mentions device_doctor.
      render: text
