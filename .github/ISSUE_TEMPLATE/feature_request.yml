name: Feature request
description: An idea to make Device Doctor better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Device Doctor to do?
      description: Describe the situation in your home that it doesn't handle well yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Any idea is welcome, even a rough one.
