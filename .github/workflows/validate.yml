# HACS validation, as recommended in https://hacs.xyz/docs/publish/action
# Required for the HACS default store; must pass without any ignored checks.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
